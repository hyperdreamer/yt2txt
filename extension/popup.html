<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>YT2TXT</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 400px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      background: #0f172a;
      color: #e2e8f0;
      padding: 14px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .header h1 {
      font-size: 16px;
      font-weight: 700;
      color: #38bdf8;
    }
    .header .version {
      font-size: 11px;
      color: #64748b;
    }

    .settings {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .settings label {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: #94a3b8;
    }
    .settings input {
      width: 100px;
      padding: 4px 6px;
      border: 1px solid #334155;
      border-radius: 4px;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 12px;
    }
    .settings input:focus {
      border-color: #38bdf8;
      outline: none;
    }

    .url-row {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }
    #url {
      flex: 1;
      padding: 6px 8px;
      border: 1px solid #334155;
      border-radius: 4px;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 12px;
    }
    #url:focus {
      border-color: #38bdf8;
      outline: none;
    }

    .actions {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }
    button {
      padding: 6px 14px;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    button.primary {
      background: #2563eb;
      color: #fff;
    }
    button.primary:hover:not(:disabled) {
      background: #1d4ed8;
    }
    button.danger {
      background: #dc2626;
      color: #fff;
    }
    button.danger:hover:not(:disabled) {
      background: #b91c1c;
    }
    button.secondary {
      background: #334155;
      color: #e2e8f0;
    }
    button.secondary:hover:not(:disabled) {
      background: #475569;
    }

    .hidden { display: none !important; }

    #status-bar {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 10px;
      min-height: 16px;
    }
    #status-bar.error { color: #f87171; }
    #status-bar.success { color: #4ade80; }

    #result {
      width: 100%;
      height: 180px;
      padding: 8px;
      border: 1px solid #334155;
      border-radius: 4px;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 12px;
      line-height: 1.5;
      resize: vertical;
      font-family: inherit;
    }
    #result:focus {
      border-color: #38bdf8;
      outline: none;
    }

    .result-actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    /* ── Light theme ──────────────────────────────────────── */
    @media (prefers-color-scheme: light) {
      body {
        background: #f8fafc;
        color: #0f172a;
      }
      .header h1 { color: #0284c7; }
      .header .version { color: #94a3b8; }

      .settings label { color: #64748b; }
      .settings input {
        border-color: #cbd5e1;
        background: #ffffff;
        color: #0f172a;
      }
      .settings input:focus { border-color: #0284c7; }

      #url {
        border-color: #cbd5e1;
        background: #ffffff;
        color: #0f172a;
      }
      #url:focus { border-color: #0284c7; }

      button.primary {
        background: #0284c7;
        color: #fff;
      }
      button.primary:hover:not(:disabled) { background: #0369a1; }
      button.danger {
        background: #dc2626;
        color: #fff;
      }
      button.danger:hover:not(:disabled) { background: #b91c1c; }
      button.secondary {
        background: #e2e8f0;
        color: #334155;
      }
      button.secondary:hover:not(:disabled) { background: #cbd5e1; }

      #status-bar { color: #64748b; }
      #status-bar.error { color: #dc2626; }
      #status-bar.success { color: #16a34a; }

      #result {
        border-color: #cbd5e1;
        background: #ffffff;
        color: #0f172a;
      }
      #result:focus { border-color: #0284c7; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>YT2TXT</h1>
    <span class="version">v0.0.4</span>
  </div>

  <div class="settings">
    <label>Host <input id="host" type="text" placeholder="localhost"></label>
    <label>Port <input id="port" type="number" placeholder="8766"></label>
  </div>

  <div class="url-row">
    <input id="url" type="text" placeholder="Paste video URL or use current page...">
  </div>

  <div class="actions">
    <button id="start" class="primary">Get Transcript</button>
    <button id="stop" class="danger hidden">Stop</button>
  </div>

  <div id="status-bar">Ready</div>

  <textarea id="result" placeholder="Transcript will appear here..."></textarea>

  <div class="result-actions">
    <button id="copy" class="secondary" disabled>Copy</button>
    <button id="download" class="secondary" disabled>Download</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
