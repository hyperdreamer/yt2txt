<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>YT2TXT</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 450px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      background: #0f172a;
      color: #e2e8f0;
      padding: 14px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .header h1 {
      font-size: 16px;
      font-weight: 700;
      color: #38bdf8;
    }
    .header .version {
      font-size: 11px;
      color: #64748b;
    }

    .tab-bar {
      display: flex;
      border-bottom: 2px solid #334155;
      padding: 0 14px;
      background: #0f172a;
      margin: 0 -14px 10px;
    }
    .tab {
      padding: 8px 16px;
      color: #94a3b8;
      font-size: 13px;
      font-weight: 600;
      border: none;
      border-bottom: 2px solid transparent;
      background: none;
      cursor: pointer;
      margin-bottom: -2px;
    }
    .tab.active {
      color: #38bdf8;
      border-bottom-color: #38bdf8;
    }

    .backend-settings {
      margin-bottom: 10px;
    }
    .backend-row {
      display: flex;
      gap: 8px;
      margin-bottom: 6px;
    }
    .backend-row:last-child { margin-bottom: 0; }
    .backend-row .row-label {
      font-size: 11px;
      color: #64748b;
      text-transform: uppercase;
      min-width: 52px;
      line-height: 24px;
    }
    .backend-row label {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: #94a3b8;
    }
    .backend-row input {
      padding: 4px 6px;
      border: 1px solid #334155;
      border-radius: 4px;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 12px;
      width: 90px;
    }
    .backend-row input:focus { border-color: #38bdf8; outline: none; }

    .settings {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .settings label {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: #94a3b8;
    }
    .settings input, .settings select {
      padding: 4px 6px;
      border: 1px solid #334155;
      border-radius: 4px;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 12px;
    }
    .settings input { width: 100px; }
    .settings select { width: 72px; cursor: pointer; }
    .settings input:focus, .settings select:focus {
      border-color: #38bdf8;
      outline: none;
    }

    .url-row {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }
    #url {
      flex: 1;
      padding: 6px 8px;
      border: 1px solid #334155;
      border-radius: 4px;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 12px;
    }
    #url:focus { border-color: #38bdf8; outline: none; }

    .actions {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }
    button {
      padding: 6px 14px;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.primary { background: #2563eb; color: #fff; }
    button.primary:hover:not(:disabled) { background: #1d4ed8; }
    button.danger { background: #dc2626; color: #fff; }
    button.danger:hover:not(:disabled) { background: #b91c1c; }
    button.secondary { background: #334155; color: #e2e8f0; }
    button.secondary:hover:not(:disabled) { background: #475569; }

    .force-label {
      display: flex; align-items: center; gap: 4px;
      font-size: 11px; color: #94a3b8; cursor: pointer; white-space: nowrap;
    }
    .force-label input { cursor: pointer; }

    .hidden { display: none !important; }

    .status-bar {
      font-size: 12px; color: #94a3b8; margin-bottom: 10px; min-height: 16px;
    }
    .status-bar.error { color: #f87171; }
    .status-bar.success { color: #4ade80; }

    #result {
      width: 100%; height: 180px; padding: 8px;
      border: 1px solid #334155; border-radius: 4px;
      background: #1e293b; color: #e2e8f0;
      font-size: 12px; line-height: 1.5; resize: vertical; font-family: inherit;
    }
    #result:focus { border-color: #38bdf8; outline: none; }

    .result-actions {
      display: flex; gap: 6px; margin-top: 8px;
    }

    .panel h1 {
      font-size: 15px; font-weight: 700; color: #38bdf8; margin-bottom: 10px;
    }

    .collapsible { margin-bottom: 10px; }
    .collapsible summary {
      color: #94a3b8; font-size: 11px; text-transform: uppercase;
      cursor: pointer; padding: 4px 0;
    }

    .option-row {
      display: flex; gap: 12px; margin-bottom: 8px; flex-wrap: wrap;
    }
    .option-row label { color: #94a3b8; font-size: 12px; cursor: pointer; white-space: nowrap; }
    .option-row input { cursor: pointer; }

    /* ── Format / Translation panel labels ─────────────────── */
    .panel-label {
      display: block;
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 4px;
      text-transform: uppercase;
    }
    .panel-header h1 {
      font-size: 15px;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 10px;
    }

    /* Format / Translation textareas (shared) */
    #format-prompt, #format-result,
    #tl-source, #tl-prompt, #tl-result {
      width: 100%;
      padding: 8px;
      border: 1px solid #334155;
      border-radius: 4px;
      background: #1e293b;
      color: #e2e8f0;
      font-size: 12px;
      line-height: 1.5;
      font-family: inherit;
      box-sizing: border-box;
      margin-bottom: 8px;
    }
    #format-prompt:focus, #format-result:focus,
    #tl-source:focus, #tl-prompt:focus, #tl-result:focus {
      border-color: #38bdf8;
      outline: none;
    }
    #format-prompt  { min-height: 60px; resize: vertical; }
    #format-result  { height: 120px; resize: vertical; }
    #tl-source      { height: 100px; resize: vertical; }
    #tl-prompt      { min-height: 60px; resize: vertical; }
    #tl-result      { height: 120px; resize: vertical; }
    #format-panel .collapsible { margin-bottom: 8px; }
    #translate-panel .collapsible { margin-bottom: 8px; }

    /* Full-width save path */
    .save-path-label {
      display: block; color: #94a3b8; font-size: 11px; margin-bottom: 8px;
    }
    .save-path-label span { display: block; margin-bottom: 2px; }
    .save-path-label input {
      box-sizing: border-box; width: 100%; padding: 5px 7px;
      border: 1px solid #334155; border-radius: 5px;
      background: #1e293b; color: #e2e8f0; font-size: 12px;
    }
    .save-path-label input:focus { border-color: #38bdf8; outline: none; }

    /* Translation result textarea */
    #tl2-result {
      width: 100%; min-height: 140px; padding: 8px;
      border: 1px solid #334155; border-radius: 4px;
      background: #1e293b; color: #e2e8f0;
      font-size: 12px; line-height: 1.5; resize: vertical; font-family: inherit;
      margin-bottom: 10px;
    }
    #tl2-result:focus { border-color: #38bdf8; outline: none; }

    /* ── Light theme ──────────────────────────────────────── */
    @media (prefers-color-scheme: light) {
      body { background: #f8fafc; color: #0f172a; }
      .header h1 { color: #0284c7; }
      .header .version { color: #94a3b8; }

      .tab-bar { border-bottom-color: #cbd5e1; background: #f8fafc; }
      .tab { color: #64748b; }
      .tab.active { color: #0284c7; border-bottom-color: #0284c7; }

      .backend-row input {
        border-color: #cbd5e1; background: #ffffff; color: #0f172a;
      }
      .backend-row input:focus { border-color: #0284c7; }

      .panel h1 { color: #0284c7; }

      .settings label { color: #64748b; }
      .settings input, .settings select {
        border-color: #cbd5e1; background: #ffffff; color: #0f172a;
      }
      .settings input:focus, .settings select:focus { border-color: #0284c7; }

      #url { border-color: #cbd5e1; background: #ffffff; color: #0f172a; }
      #url:focus { border-color: #0284c7; }

      button.primary { background: #0284c7; color: #fff; }
      button.primary:hover:not(:disabled) { background: #0369a1; }
      button.danger { background: #dc2626; color: #fff; }
      button.danger:hover:not(:disabled) { background: #b91c1c; }
      button.secondary { background: #e2e8f0; color: #334155; }
      button.secondary:hover:not(:disabled) { background: #cbd5e1; }

      .status-bar { color: #64748b; }
      .status-bar.error { color: #dc2626; }
      .status-bar.success { color: #16a34a; }

      .collapsible summary { color: #64748b; }
      .option-row label { color: #334155; }

      #result, #tl2-result {
        border-color: #cbd5e1; background: #ffffff; color: #0f172a;
      }
      #result:focus, #tl2-result:focus { border-color: #0284c7; }

      #translate-prompt {
        background: #ffffff; color: #0f172a; border-color: #cbd5e1;
      }
      #translate-prompt:focus { border-color: #0284c7; }

      .save-path-label { color: #64748b; }
      .save-path-label input {
        border-color: #cbd5e1; background: #ffffff; color: #0f172a;
      }
      .save-path-label input:focus { border-color: #0284c7; }

      .force-label { color: #64748b; }

      #format-prompt, #format-result,
      #tl-source, #tl-prompt, #tl-result {
        border-color: #cbd5e1; background: #ffffff; color: #0f172a;
      }
      #format-prompt:focus, #format-result:focus,
      #tl-source:focus, #tl-prompt:focus, #tl-result:focus {
        border-color: #0284c7;
      }
      .panel-header h1 { color: #0284c7; }
      .panel-label { color: #64748b; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>YT2TXT</h1>
    <span class="version">v0.0.29</span>
  </div>

  <div class="tab-bar">
    <button class="tab active" data-panel="transcript-panel">Transcript</button>
    <button class="tab" data-panel="format-panel">Format</button>
    <button class="tab" data-panel="translation-panel">Translation</button>
  </div>

  <div class="backend-settings">
    <div class="backend-row">
      <span class="row-label">YT2TXT</span>
      <label>Host <input id="host" type="text" placeholder="localhost"></label>
      <label>Port <input id="port" type="number" placeholder="8666"></label>
    </div>
    <div class="backend-row">
      <span class="row-label">TextKit</span>
      <label>Host <input id="textkit-host" type="text" placeholder="localhost"></label>
      <label>Port <input id="textkit-port" type="number" placeholder="8765"></label>
    </div>
  </div>

  <div id="transcript-panel" class="panel">
    <div class="settings">
      <label>Lang
        <select id="lang">
          <option value="en">EN</option>
          <option value="zh">中文</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="es">ES</option>
          <option value="fr">FR</option>
          <option value="de">DE</option>
          <option value="ru">RU</option>
          <option value="ar">AR</option>
          <option value="pt">PT</option>
          <option value="hi">HI</option>
          <option value="">Original</option>
          <option value="all">All</option>
        </select>
      </label>
    </div>

    <div class="url-row">
      <input id="url" type="text" placeholder="Paste video URL or use current page...">
    </div>

    <div class="actions">
      <button id="start" class="primary">Get Transcript</button>
      <label class="force-label"><input type="checkbox" id="force"> Force refresh</label>
      <button id="stop" class="danger hidden">Stop</button>
    </div>

    <div id="status-bar" class="status-bar">Ready</div>

    <textarea id="result" placeholder="Transcript will appear here..."></textarea>

    <div class="result-actions">
      <button id="copy" class="secondary" disabled>Copy</button>
      <button id="download" class="secondary" disabled>Download</button>
    </div>
  </div>

  <div id="format-panel" class="panel hidden">
    <div class="panel-header">
      <h1>Format Transcript</h1>
    </div>
    <details class="collapsible">
      <summary>Formatting Instructions (optional)</summary>
      <textarea id="format-prompt" placeholder="E.g.: Format this transcript into well-structured paragraphs..."></textarea>
    </details>
    <div class="actions">
      <button id="format-btn" class="primary" disabled>Format</button>
    </div>
    <div id="format-status-bar" class="status-bar">Ready</div>
    <label class="panel-label" for="format-result">Formatted Result</label>
    <textarea id="format-result" readonly placeholder="Formatted text will appear here..."></textarea>
    <div class="result-actions">
      <button id="format-copy" class="secondary" disabled>Copy</button>
    </div>
  </div>

  <div id="translation-panel" class="panel hidden">
    <h1>Translation</h1>
    <div class="settings">
      <label>Language
        <select id="tl2-language">
          <option value="original">Original</option>
          <option value="Chinese">Chinese</option>
          <option value="English">English</option>
          <option value="Japanese">Japanese</option>
          <option value="Korean">Korean</option>
          <option value="French">French</option>
          <option value="German">German</option>
          <option value="Spanish">Spanish</option>
        </select>
      </label>
    </div>
    <details class="collapsible">
      <summary>Translation Prompt</summary>
      <textarea id="translate-prompt" placeholder="Custom AI prompt (per language). E.g.: Translate to formal academic Chinese." style="width:100%;min-height:100px;box-sizing:border-box;padding:6px;border:1px solid #334155;border-radius:4px;background:#1e293b;color:#e2e8f0;font-size:12px;resize:vertical;font-family:inherit;"></textarea>
    </details>
    <div id="tl2-status-bar" class="status-bar">Ready</div>
    <textarea id="tl2-result" readonly placeholder="Translation will appear here..."></textarea>
    <div class="option-row">
      <label><input id="tl2-autocopy" type="checkbox"> Auto-copy</label>
      <label><input id="tl2-autosave" type="checkbox"> Auto-save</label>
      <label><input id="tl2-autotranslate" type="checkbox"> Auto-translate</label>
    </div>
    <div class="save-path-label">
      <span>Save path</span>
      <input id="tl2-autosave-path" type="text" placeholder="e.g. transcripts/translated.txt" list="tl2-path-suggestions">
      <datalist id="tl2-path-suggestions"></datalist>
    </div>
    <div class="actions">
      <button id="tl2-translate" class="primary" disabled>Translate</button>
      <button id="tl2-copy" class="secondary" disabled>Copy</button>
      <button id="tl2-save" class="secondary" disabled>Save</button>
      <button id="tl2-download" class="secondary" disabled>Download</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
