tasks:
  - id: T-001
    plan_task: 1
    title: "Add Operation Ownership and Per-Tab Storage Queue Seams"
    lane: extension-sequential
    sequence: 1
    tier: capable
    category: ownership-and-storage
    owns: ["extension/operation_ownership.js", "extension/storage_queue.js", "tests/storage_queue.test.js"]
    resources: []
    depends_on: []
    interfaces:
      produces: [I-101]
      consumes: []
    validation:
      - argv: ["node", "--test", "tests/storage_queue.test.js"]
        cwd: "."
        timeout_seconds: 300
      - argv: ["node", "--check", "extension/operation_ownership.js"]
        cwd: "."
        timeout_seconds: 30
      - argv: ["node", "--check", "extension/storage_queue.js"]
        cwd: "."
        timeout_seconds: 30
  - id: T-002
    plan_task: 2
    title: "Integrate Root Ownership, Stage Handoffs, and Force Propagation"
    lane: extension-sequential
    sequence: 2
    tier: capable
    category: worker-ownership-and-force
    owns: ["extension/background.js", "tests/operation_lifecycle.test.js", "tests/force_propagation.test.js"]
    resources: []
    depends_on: [T-001]
    interfaces:
      produces: [I-102]
      consumes: [I-101, I-104]
    validation:
      - argv: ["node", "--test", "tests/operation_lifecycle.test.js", "tests/force_propagation.test.js", "tests/background.test.js", "tests/filebridge.test.js"]
        cwd: "."
        timeout_seconds: 600
  - id: T-003
    plan_task: 3
    title: "Add Versioned Records, Restart Reconciliation, and Durable Stop"
    lane: extension-sequential
    sequence: 3
    tier: capable
    category: recovery-and-stop
    owns: ["extension/background.js", "tests/storage_reconciliation.test.js"]
    resources: []
    depends_on: [T-002]
    interfaces:
      produces: [I-103]
      consumes: [I-102, I-101]
    validation:
      - argv: ["node", "--test", "tests/storage_reconciliation.test.js", "tests/operation_lifecycle.test.js", "tests/force_propagation.test.js", "tests/background.test.js", "tests/filebridge.test.js"]
        cwd: "."
        timeout_seconds: 900
  - id: T-004
    plan_task: 4
    title: "Hydrate Popup State and Manual Retry Without Restoration Races"
    lane: extension-sequential
    sequence: 4
    tier: advanced
    category: popup-hydration-and-retry
    owns: ["extension/popup.js", "tests/popup_recovery.test.js", "tests/popup.test.js"]
    resources: []
    depends_on: [T-003]
    interfaces:
      produces: []
      consumes: [I-103, I-102]
    validation:
      - argv: ["node", "--test", "tests/popup_recovery.test.js", "tests/popup.test.js", "tests/content.test.js"]
        cwd: "."
        timeout_seconds: 600
  - id: T-005
    plan_task: 5
    title: "Document Deployment Order and Run the Complete Consumer Verification"
    lane: extension-sequential
    sequence: 5
    tier: standard
    category: documentation-and-verification
    owns: ["README.md"]
    resources: []
    depends_on: [T-004]
    interfaces:
      produces: []
      consumes: [I-103, I-104]
    validation:
      - argv: ["node", "--check", "extension/operation_ownership.js"]
        cwd: "."
        timeout_seconds: 30
      - argv: ["node", "--check", "extension/storage_queue.js"]
        cwd: "."
        timeout_seconds: 30
      - argv: ["node", "--check", "extension/background.js"]
        cwd: "."
        timeout_seconds: 30
      - argv: ["node", "--check", "extension/popup.js"]
        cwd: "."
        timeout_seconds: 30
      - argv: ["node", "--test", "tests/background.test.js", "tests/popup.test.js", "tests/content.test.js", "tests/filebridge.test.js", "tests/storage_queue.test.js", "tests/operation_lifecycle.test.js", "tests/storage_reconciliation.test.js", "tests/popup_recovery.test.js", "tests/force_propagation.test.js"]
        cwd: "."
        timeout_seconds: 1200
